<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Filter Builder (Enterprise) - ApexGrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="../apex-grid-enterprise.min.js"></script>
    <style>
      body {
        max-width: 1100px;
        margin: 0 auto;
        font-family: 'Inter', sans-serif;
        background: #fff;
        padding: 20px;
      }
      h2 {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a2e;
        margin: 0 0 4px 0;
      }
      .subtitle {
        font-size: 13px;
        color: #888;
        margin-bottom: 16px;
      }
      .badge {
        font-size: 13px;
        font-weight: 500;
        color: #92400e;
        background: #fef3c7;
        border: 1px solid #fde68a;
        border-radius: 20px;
        padding: 2px 10px;
        vertical-align: middle;
      }
      code {
        background: #f1f1f1;
        padding: 0 0.25rem;
        border-radius: 3px;
      }
      .layout {
        display: flex;
        gap: 16px;
        align-items: flex-start;
      }
      apex-grid-enterprise {
        flex: 1;
        min-height: 360px;
        --ig-size: 2;
      }
    </style>
    <script type="module">
      try {
        const resp = await fetch('https://cdn.jsdelivr.net/npm/igniteui-webcomponents@5/themes/light/bootstrap.css');
        const css = await resp.text();
        const style = document.createElement('style');
        style.textContent = css.replaceAll(':root', 'apex-grid-enterprise');
        document.head.appendChild(style);
      } catch (e) { /* theme is cosmetic */ }
    </script>
  </head>
  <body>
    <h2>Advanced Filter Builder <span class="badge">Enterprise</span></h2>
    <p class="subtitle">
      Build a nested AND/OR query with <code>&lt;apex-grid-filter-builder&gt;</code>. Add conditions and
      sub-groups, then <strong>Apply</strong>. Here: <em>(region = EMEA OR region = AMER) AND salary &gt; 80000</em>.
    </p>
    <div class="layout">
      <apex-grid-filter-builder id="builder"></apex-grid-filter-builder>
      <apex-grid-enterprise id="grid"></apex-grid-enterprise>
    </div>
    <script type="module">
      const data = [
        { id: 1, name: 'Ava Morgan', department: 'Engineering', region: 'EMEA', salary: 96000 },
        { id: 2, name: 'Liam Chen', department: 'Engineering', region: 'AMER', salary: 104000 },
        { id: 3, name: 'Noah Patel', department: 'Engineering', region: 'EMEA', salary: 88000 },
        { id: 4, name: 'Emma Davis', department: 'Sales', region: 'AMER', salary: 72000 },
        { id: 5, name: 'Olivia Rossi', department: 'Sales', region: 'EMEA', salary: 69000 },
        { id: 6, name: 'William Kim', department: 'Sales', region: 'APAC', salary: 81000 },
        { id: 7, name: 'Sophia Nguyen', department: 'Marketing', region: 'EMEA', salary: 64000 },
        { id: 8, name: 'James Muller', department: 'Marketing', region: 'AMER', salary: 71000 },
        { id: 9, name: 'Isabella Costa', department: 'Engineering', region: 'APAC', salary: 99000 },
        { id: 10, name: 'Mateo Silva', department: 'Sales', region: 'EMEA', salary: 75000 },
      ];

      const grid = document.getElementById('grid');
      grid.columns = [
        { key: 'name', headerText: 'Name' },
        { key: 'department', headerText: 'Department' },
        { key: 'region', headerText: 'Region' },
        { key: 'salary', headerText: 'Salary', type: 'number' },
      ];
      grid.data = data;

      const builder = document.getElementById('builder');
      builder.grid = grid;
      // Seed a nested example so the demo (and its snapshot) show a real query.
      builder.model = {
        kind: 'group',
        join: 'and',
        children: [
          {
            kind: 'group',
            join: 'or',
            children: [
              { kind: 'condition', column: 'region', operator: 'equals', value: 'EMEA' },
              { kind: 'condition', column: 'region', operator: 'equals', value: 'AMER' },
            ],
          },
          { kind: 'condition', column: 'salary', operator: 'greaterThan', value: 80000 },
        ],
      };
    </script>
  </body>
</html>

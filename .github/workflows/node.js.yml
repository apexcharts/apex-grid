# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run lint
      - run: npm run build
      # After the build: the enterprise tests resolve apex-grid through core's
      # dist/, and core's own sources import the generated *.css.ts files.
      - run: npm run typecheck
      - run: npm run test
      # One upload per package: each lcov names files relative to its own
      # package (src/...), so each needs its own base-path, and the two
      # parallel uploads are then closed as one build.
      - name: Publish core coverage to coveralls.io
        if: matrix.node-version == '20.x'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          file: ./packages/core/coverage/lcov.info
          base-path: packages/core
          flag-name: core
          parallel: true
      - name: Publish enterprise coverage to coveralls.io
        if: matrix.node-version == '20.x'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          file: ./packages/enterprise/coverage/lcov.info
          base-path: packages/enterprise
          flag-name: enterprise
          parallel: true
      - name: Close the coveralls.io build
        if: matrix.node-version == '20.x'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ github.token }}
          parallel-finished: true
          carryforward: core,enterprise
